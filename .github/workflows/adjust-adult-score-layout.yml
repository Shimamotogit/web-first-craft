name: Adjust custom score and layout

on:
  push:
    paths:
      - 'scripts/temporary_adjust_adult_score_layout.py'
      - '.github/workflows/adjust-adult-score-layout.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record child mode hashes
        run: sha256sum web/child.html web/js/child.js web/css/child.css > /tmp/child-before.sha256
      - name: Apply custom mode changes
        run: python3 scripts/temporary_adjust_adult_score_layout.py
      - name: Check syntax
        run: |
          node --check web/js/adult.js
          python3 -m py_compile tests/test_adult_browser.py tests/test_server.py tests/check_static.py
      - name: Run static checks
        run: python3 tests/check_static.py
      - name: Run server integration tests
        run: python3 tests/test_server.py
      - name: Run real browser custom mode regression
        run: python3 tests/test_adult_browser.py
      - name: Verify child mode is untouched
        run: sha256sum -c /tmp/child-before.sha256
      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/adult.html web/js/adult.js tests/test_adult_browser.py
          git commit -m 'Simplify custom scoring and align layouts'
          git push
