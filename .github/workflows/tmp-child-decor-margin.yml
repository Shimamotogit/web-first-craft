name: Temporary child decoration margin patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/_tmp_child_decor_margin.py
      - run: node --check web/js/child.js
      - run: python3 tests/check_static.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/js/child.js tests/check_static.py
          git commit -m "Remove child decoration reserved margin"
          git push
