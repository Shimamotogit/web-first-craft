name: Apply adult favorites and color picker patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python3 scripts/tmp_adult_favorites_color_patch.py
      - name: Check JavaScript syntax
        run: node --check web/js/adult.js
      - name: Check static structure
        run: python3 tests/check_static.py
      - name: Test custom mode in real browser
        run: python3 tests/test_adult_browser.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/adult.html web/css/adult.css web/js/adult.js tests/test_adult_browser.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Improve custom favorites and color controls"
            git push
          fi
