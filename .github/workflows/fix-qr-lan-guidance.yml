name: Fix QR LAN guidance

on:
  push:
    paths:
      - .github/workflows/fix-qr-lan-guidance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Update QR LAN guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('web/js/child.js'): {
                  'server.py で起動しているか確認してね。': 'LANサーバーに接続できません。インストール時に表示された「このPC」または「同じLAN」のURLから開いているか確認してね。',
                  'QRは python server.py で起動したときにつかえるよ。このパソコンへの保存はできます。': 'QRはLANサーバーから開いたときにつかえるよ。インストール時に表示された「このPC」または「同じLAN」のURLから開いてね。このパソコンへの保存はできます。',
                  'QRは python server.py で きどうすると つかえるよ': 'QRはLANサーバーから開くと つかえるよ。インストール時に表示されたURLから開いてね',
              },
              Path('web/js/adult.js'): {
                  'python server.py で起動しているか確認してください。': 'LANサーバーに接続できません。インストール時に表示された「このPC」または「同じLAN」のURLから開いているか確認してください。',
                  'QR機能は python server.py で起動すると使えます': 'QR機能はLANサーバーから開くと使えます。インストール時に表示されたURLから開いてください',
              },
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f'missing replacement anchor in {path}: {old}')
                  text = text.replace(old, new)
              if 'server.py' in text:
                  raise SystemExit(f'legacy server.py guidance remains in {path}')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check web/js/child.js
          node --check web/js/adult.js
          python3 -m py_compile server/app.py tests/test_server.py tests/check_static.py
          python3 tests/check_static.py
          python3 tests/test_server.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/js/child.js web/js/adult.js
          git commit -m "Fix QR guidance for systemd LAN server"
          git push origin HEAD:main
