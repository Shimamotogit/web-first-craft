name: Apply phone upload back button

on:
  push:
    paths:
      - .github/workflows/apply-phone-back-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Add back button to phone upload page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('server/app.py')
          text = app.read_text(encoding='utf-8')

          old_css = 'h1{{margin:.1em 0;font-size:1.65rem}}.kicker{{margin:0;color:#a8382b;font-weight:900;letter-spacing:.12em}}'
          new_css = 'h1{{margin:.1em 0;font-size:1.65rem}}.back-button{{width:auto;min-height:44px;margin:0 0 14px;padding:7px 14px;color:#2d2a26;background:#fff;border:2px solid #776f64;border-radius:10px;font:inherit;font-weight:900;cursor:pointer}}.kicker{{margin:0;color:#a8382b;font-weight:900;letter-spacing:.12em}}'
          if old_css not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(old_css, new_css, 1)

          old_body = '<body><main><p class="kicker">SAME WI-FI PHOTO</p><h1>写真をパソコンへ送る</h1>'
          new_body = '<body><main><button id="back" class="back-button" type="button">← もどる</button><p class="kicker">SAME WI-FI PHOTO</p><h1>写真をパソコンへ送る</h1>'
          if old_body not in text:
              raise SystemExit('body anchor not found')
          text = text.replace(old_body, new_body, 1)

          old_js = "const token={token_json};const input=document.getElementById('photo');const cameraInput=document.getElementById('cameraPhoto');const preview=document.getElementById('preview');const send=document.getElementById('send');const status=document.getElementById('status');let photo='';"
          new_js = "const token={token_json};const back=document.getElementById('back');const input=document.getElementById('photo');const cameraInput=document.getElementById('cameraPhoto');const preview=document.getElementById('preview');const send=document.getElementById('send');const status=document.getElementById('status');let photo='';\nback.addEventListener('click',()=>{if(window.history.length>1){window.history.back();return;}window.close();setTimeout(()=>{back.textContent='このタブを閉じてください';},150);});"
          if old_js not in text:
              raise SystemExit('JS anchor not found')
          text = text.replace(old_js, new_js, 1)
          app.write_text(text, encoding='utf-8')

          test = Path('tests/test_server.py')
          t = test.read_text(encoding='utf-8')
          old_test = "            assert \"capture=\" not in gallery_tag and 'capture=\"user\"' in camera_tag\n"
          new_test = old_test + "            assert 'id=\"back\"' in phone_page and '← もどる' in phone_page and \"history.back()\" in phone_page\n"
          if old_test not in t:
              raise SystemExit('test anchor not found')
          t = t.replace(old_test, new_test, 1)
          test.write_text(t, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 -m py_compile server/app.py tests/test_server.py tests/check_static.py
          python3 tests/check_static.py
          python3 tests/test_server.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.py tests/test_server.py
          git commit -m "Add back button to phone photo upload"
          git push origin HEAD:main
