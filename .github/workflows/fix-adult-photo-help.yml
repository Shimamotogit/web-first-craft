name: Fix adult photo and scoring help

on:
  push:
    paths:
      - '.github/workflows/fix-adult-photo-help.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python3 scripts/temporary_fix_adult_feedback.py
      - name: Validate
        run: |
          node --check web/js/adult.js
          python3 -m py_compile tests/check_static.py
          python3 tests/check_static.py
          python3 tests/test_server.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/adult.html web/js/adult.js web/css/adult.css tests/check_static.py
          git commit -m 'Fix adult profile photo and scoring help feedback'
          git push
