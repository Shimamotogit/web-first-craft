name: Restore built-in QR server

on:
  push:
    paths:
      - '.github/workflows/restore-built-in-qr.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore single-server public architecture
        run: |
          git checkout 8d897d09624eed7b9678461b154ddef27925683e -- \
            .github/workflows/pages.yml \
            README.md \
            docs/public-deployment.md \
            scripts/systemd/install.sh \
            server/app.py \
            tests/check_static.py \
            tests/test_server.py \
            web/adult.html \
            web/child.html \
            web/index.html \
            web/js/adult.js \
            web/js/child.js
          rm -f web/runtime-config.js

      - name: Validate
        run: |
          node --check web/js/child.js
          node --check web/js/adult.js
          python3 -m py_compile server/app.py tests/check_static.py tests/test_server.py
          python3 tests/check_static.py
          python3 tests/test_server.py
          bash -n scripts/launch/start-local.command scripts/systemd/install.sh scripts/systemd/uninstall.sh
          CHECK_ONLY=1 bash scripts/systemd/install.sh

      - name: Commit
        run: |
          git config user.name 'Shimamotogit'
          git config user.email '134857097+Shimamotogit@users.noreply.github.com'
          git add -A
          git commit -m 'Use built-in QR server for public site'
          git push origin main
