name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check child.js
          node --check adult.js
      - name: Check static structure and privacy boundaries
        run: python3 scripts/check_static.py
      - name: Check Python syntax
        run: python3 -m py_compile server.py scripts/test_server.py
      - name: Check Ubuntu service scripts
        run: |
          bash -n scripts/install-ubuntu-service.sh scripts/uninstall-ubuntu-service.sh
          CHECK_ONLY=1 bash scripts/install-ubuntu-service.sh
      - name: Test LAN transfer server
        run: python3 scripts/test_server.py
