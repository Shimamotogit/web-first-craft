name: Retry static review fixes

on:
  push:
    paths:
      - .github/workflows/retry-static-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Reuse reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('.github/workflows/apply-static-review-fixes.yml').read_text(encoding='utf-8')
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit('review patch body not found')
          exec(compile(textwrap.dedent(match.group(1)), 'review-fixes', 'exec'))
          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text(encoding='utf-8')
          text = text.replace('      url: \n', '      url: $' + '{{ steps.deployment.outputs.page_url }}\n')
          pages.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check web/js/child.js
          node --check web/js/adult.js
          python3 -m py_compile server/app.py tests/check_static.py tests/test_server.py
          python3 tests/check_static.py
          python3 tests/test_server.py
          bash -n scripts/launch/start-local.command scripts/systemd/install.sh scripts/systemd/uninstall.sh
          CHECK_ONLY=1 bash scripts/systemd/install.sh
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.py tests/check_static.py tests/test_server.py web/index.html scripts/systemd/install.sh .github/workflows/pages.yml README.md SECURITY.md
          git commit -m "Apply static review fixes"
          git push origin HEAD:main
