name: Apply photo decor multi-user fix

on:
  push:
    paths:
      - scripts/patch_photo_decor_multiuser.py
      - .github/workflows/apply-photo-decor-multiuser-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 scripts/patch_photo_decor_multiuser.py
      - name: Validate
        run: |
          node --check child.js
          python3 -m py_compile server.py scripts/test_server.py
          python3 scripts/check_static.py
          python3 scripts/test_server.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add child.js server.py scripts/test_server.py
          git commit -m "Fix child decoration and multi-user photo flow"
          git push origin HEAD:main
