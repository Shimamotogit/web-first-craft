name: Fix custom mode export and preview

on:
  push:
    paths:
      - '.github/workflows/fix-adult-export-preview.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply and verify custom mode fixes
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sha256sum web/child.html web/js/child.js web/css/child.css > /tmp/child-before.sha256
          {
            echo '=== apply patch ==='
            python3 scripts/temporary_fix_adult_export_preview.py
            echo '=== JS syntax ==='
            node --check web/js/adult.js
            echo '=== Python syntax ==='
            python3 -m py_compile tests/test_adult_browser.py tests/test_server.py tests/check_static.py server/app.py
            echo '=== static ==='
            python3 tests/check_static.py
            echo '=== server ==='
            python3 tests/test_server.py
            echo '=== browser ==='
            python3 tests/test_adult_browser.py
            echo '=== child hashes ==='
            sha256sum -c /tmp/child-before.sha256
          } > /tmp/fix.log 2>&1
          status=$?
          cat /tmp/fix.log
          if [ "$status" -eq 0 ]; then
            git add web/adult.html web/css/adult.css web/js/adult.js tests/test_adult_browser.py
            git commit -m 'Improve custom photo preview and mobile export'
          else
            printf 'status=%s\n' "$status" > tests/temporary_adult_fix_log.txt
            cat /tmp/fix.log >> tests/temporary_adult_fix_log.txt
            git add tests/temporary_adult_fix_log.txt
            git commit -m 'Record custom mode fix failure'
          fi
          git push
