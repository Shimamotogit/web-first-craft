name: Fix custom mode export and preview

on:
  push:
    paths:
      - '.github/workflows/fix-adult-export-preview.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record child mode hashes
        run: sha256sum web/child.html web/js/child.js web/css/child.css > /tmp/child-before.sha256
      - name: Apply custom mode fixes
        run: python3 scripts/temporary_fix_adult_export_preview.py
      - name: Validate syntax
        run: |
          node --check web/js/adult.js
          python3 -m py_compile tests/test_adult_browser.py tests/test_server.py tests/check_static.py server/app.py
      - name: Run static and server tests
        run: |
          python3 tests/check_static.py
          python3 tests/test_server.py
      - name: Run real browser regression
        run: python3 tests/test_adult_browser.py
      - name: Verify child mode untouched
        run: sha256sum -c /tmp/child-before.sha256
      - name: Commit verified custom mode fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/adult.html web/css/adult.css web/js/adult.js tests/test_adult_browser.py
          git commit -m 'Improve custom photo preview and mobile export'
          git push
