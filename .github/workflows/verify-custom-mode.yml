name: Verify custom mode exhaustively

on:
  push:
    paths:
      - '.github/workflows/verify-custom-mode.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run exhaustive browser and server verification
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/temporary_fix_adult_browser_test2.py
          {
            echo '=== JavaScript syntax ==='
            node --check web/js/adult.js
            echo '=== test Python syntax ==='
            python3 -m py_compile tests/test_adult_browser.py
            echo '=== static checks ==='
            python3 tests/check_static.py
            echo '=== server integration ==='
            python3 tests/test_server.py
            echo '=== custom browser regression ==='
            python3 tests/test_adult_browser.py
          } > /tmp/custom-verification.log 2>&1
          status=$?
          cat /tmp/custom-verification.log
          printf 'status=%s\n' "$status" > tests/temporary_custom_verification.txt
          cat /tmp/custom-verification.log >> tests/temporary_custom_verification.txt
          git add tests/test_adult_browser.py tests/temporary_custom_verification.txt
          git commit -m 'Finalize exhaustive custom mode browser verification'
          git push
          exit 0
