name: Restore project main
# reconstruction revision 7

on:
  push:
    paths:
      - ".github/workflows/restore-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify final Git bundle
        shell: bash
        run: |
          cat \
            .hydrate/part00 \
            .hydrate/part01 \
            .hydrate/pair00 \
            .restore/p02_a \
            .restore/p02_b \
            .restore/p02_c \
            .restore/p02_d \
            .hydrate/pair02 \
            .hydrate/pair03 \
            .hydrate/pair04 \
            .hydrate/pair05 \
            .restore/pair07 \
            .hydrate/pair08 \
            .restore/p09_a \
            .restore/p09_b \
            .restore/p09_c \
            .restore/p09_d \
            .restore/p10_00 \
            .restore/p11_a \
            .restore/p11_b \
            .restore/p11_01 \
            .restore/p12_00 \
            .restore/p12_01 \
            .restore/p13_00 \
            .restore/p13_01 \
            > /tmp/project.bundle.b64
          base64 -d /tmp/project.bundle.b64 > /tmp/project.bundle
          HEAD_SHA="$(git bundle list-heads /tmp/project.bundle | awk '$2=="refs/heads/main"{print $1}')"
          echo "bundle main: ${HEAD_SHA}"
          test "${HEAD_SHA}" = "fb5feaf66be603cf148d6c1faa028c732fb9acb7"
          rm -rf /tmp/restored
          git clone --branch main /tmp/project.bundle /tmp/restored
          test "$(git -C /tmp/restored rev-parse HEAD)" = "fb5feaf66be603cf148d6c1faa028c732fb9acb7"

      - name: Publish project while preserving bootstrap workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/restored
          rm -f .github/workflows/check.yml .github/workflows/pages.yml
          mkdir -p .github/workflows
          cp "${GITHUB_WORKSPACE}/.github/workflows/restore-main.yml" .github/workflows/restore-main.yml
          cp "${GITHUB_WORKSPACE}/.github/workflows/restore-final.yml" .github/workflows/restore-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish web-first-craft project"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main:main
