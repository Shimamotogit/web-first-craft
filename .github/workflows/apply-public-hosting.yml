name: Apply public hosting support

on:
  push:
    paths:
      - .github/workflows/apply-public-hosting.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply public hosting changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found: {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # server/app.py: support public HTTPS origins and safer public capacity handling.
          replace_once('server/app.py', '"""LAN-only server for じぶんページ工房.\n\nServes the editor, receives temporary phone photo uploads, and exposes temporary\nfinished-page downloads. All transfer data stays in memory and expires.\n"""', '"""Web server for じぶんページ工房.\n\nServes the editor, receives temporary phone photo uploads, and exposes temporary\nfinished-page downloads. It supports local/LAN use and public HTTPS deployments.\nAll transfer data stays in memory and expires.\n"""')
          replace_once('server/app.py', 'MAX_SESSION_MEMORY_BYTES = 96 * 1024 * 1024\nSAFE_STATIC = {', 'MAX_SESSION_MEMORY_BYTES = 96 * 1024 * 1024\nMAX_SESSION_CREATES_PER_MINUTE = int(os.environ.get("MAX_SESSION_CREATES_PER_MINUTE", "60"))\nSAFE_STATIC = {')
          replace_once('server/app.py', 'card_sessions: dict[str, dict] = {}\n\n\ndef now()', 'card_sessions: dict[str, dict] = {}\nsession_create_times: list[float] = []\n\n\ndef now()')

          old='''def reserve_session_capacity_locked(additional_bytes: int = 0, protected: tuple | None = None, extra_session: bool = False) -> bool:\n    _cleanup_expired_locked()\n    stores = (photo_sessions, share_sessions, card_sessions)\n    records = [(store, key, item) for store in stores for key, item in store.items()]\n    used = sum(session_payload_bytes(item) for _, _, item in records)\n    target_count = len(records) + (1 if extra_session else 0)\n    candidates = sorted(\n        (record for record in records if protected is None or not (record[0] is protected[0] and record[1] == protected[1])),\n        key=lambda record: record[2].get("created_at", 0),\n    )\n    while target_count > MAX_ACTIVE_SESSIONS or used + additional_bytes > MAX_SESSION_MEMORY_BYTES:\n        if not candidates:\n            return False\n        store, key, item = candidates.pop(0)\n        used -= session_payload_bytes(item)\n        target_count -= 1\n        store.pop(key, None)\n    return True\n'''
          new='''def reserve_session_capacity_locked(additional_bytes: int = 0, protected: tuple | None = None, extra_session: bool = False) -> bool:\n    # Expired data may be removed, but an active participant session is never evicted\n    # just because another browser creates a new QR session.\n    _cleanup_expired_locked()\n    stores = (photo_sessions, share_sessions, card_sessions)\n    records = [(store, key, item) for store in stores for key, item in store.items()]\n    used = sum(session_payload_bytes(item) for _, _, item in records)\n    target_count = len(records) + (1 if extra_session else 0)\n    return target_count <= MAX_ACTIVE_SESSIONS and used + additional_bytes <= MAX_SESSION_MEMORY_BYTES\n\n\ndef allow_session_create_locked() -> bool:\n    cutoff = now() - 60\n    session_create_times[:] = [created for created in session_create_times if created > cutoff]\n    if len(session_create_times) >= MAX_SESSION_CREATES_PER_MINUTE:\n        return False\n    session_create_times.append(now())\n    return True\n'''
          replace_once('server/app.py', old, new)

          insert='''def safe_filename(value: str) -> str:\n    cleaned = re.sub(r"[\\\\/:*?\\\"<>|\\r\\n]+", "-", str(value)).strip(" .-")[:60]\n    return cleaned or "じぶんページ.html"\n'''
          helpers='''def safe_filename(value: str) -> str:\n    cleaned = re.sub(r"[\\\\/:*?\\\"<>|\\r\\n]+", "-", str(value)).strip(" .-")[:60]\n    return cleaned or "じぶんページ.html"\n\n\ndef normalize_public_base_url(value: str) -> str:\n    value = str(value or "").strip()\n    if not value:\n        return ""\n    parsed = urlparse(value)\n    if parsed.scheme not in {"http", "https"} or not parsed.netloc or parsed.path not in {"", "/"} or parsed.params or parsed.query or parsed.fragment:\n        raise ValueError("PUBLIC_BASE_URL must be an origin such as https://example.com")\n    if any(ch in parsed.netloc for ch in "\\r\\n"):\n        raise ValueError("invalid PUBLIC_BASE_URL")\n    return f"{parsed.scheme}://{parsed.netloc}"\n\n\ndef safe_host_header(value: str) -> bool:\n    return bool(value) and len(value) <= 255 and bool(re.fullmatch(r"[A-Za-z0-9.\\-:\\[\\]]+", value))\n\n\ndef is_local_host_header(value: str) -> bool:\n    try:\n        hostname = (urlparse("http://" + value).hostname or "").lower()\n    except ValueError:\n        return True\n    return hostname in {"localhost", "127.0.0.1", "::1"}\n'''
          replace_once('server/app.py', insert, helpers)
          replace_once('server/app.py', '<body><main><button id="back" class="back-button" type="button">← もどる</button><p class="kicker">SAME WI-FI PHOTO</p><h1>写真をパソコンへ送る</h1>\n<p class="notice">この写真は同じLAN内の作成画面へだけ送られ、約{remaining}分でサーバーのメモリから消えます。</p>', '<body><main><button id="back" class="back-button" type="button">← もどる</button><p class="kicker">PHOTO TRANSFER</p><h1>写真をパソコンへ送る</h1>\n<p class="notice">この写真は、このサイトの作成画面へ一時的に送られ、約{remaining}分でサーバーのメモリから消えます。</p>')
          replace_once('server/app.py', '<body><main><p class="kicker">SAME WI-FI SHARE</p><h1>{nickname}を受け取る</h1><p>同じLAN内のパソコンから、一時的に共有されています。</p>', '<body><main><p class="kicker">TEMPORARY SHARE</p><h1>{nickname}を受け取る</h1><p>作成画面から、一時的に共有されています。</p>')
          replace_once('server/app.py', '    server_version = "JibunPageKobo/2.0"', '    server_version = "JibunPageKobo/2.1"')
          replace_once('server/app.py', '''    @property\n    def base_url(self) -> str:\n        return f"http://{self.server.lan_ip}:{self.server.server_port}"  # type: ignore[attr-defined]\n''', '''    @property\n    def base_url(self) -> str:\n        configured = str(getattr(self.server, "public_base_url", "") or "")\n        if configured:\n            return configured\n        host = self.headers.get("Host", "").strip()\n        forwarded_proto = self.headers.get("X-Forwarded-Proto", "").split(",", 1)[0].strip().lower()\n        if safe_host_header(host):\n            # HTTPS reverse proxies normally preserve Host and send X-Forwarded-Proto.\n            if forwarded_proto == "https":\n                return f"https://{host}"\n            # When the editor itself was opened through a LAN/public hostname, use that\n            # exact host so the QR points back to the same reachable server.\n            if not is_local_host_header(host):\n                return f"http://{host}"\n        # localhost is not reachable from a phone, so local development falls back\n        # to the best LAN address detected on the machine.\n        return f"http://{self.server.lan_ip}:{self.server.server_port}"  # type: ignore[attr-defined]\n\n    @property\n    def transfer_mode(self) -> str:\n        return "public" if self.base_url.startswith("https://") else "local"\n''')
          replace_once('server/app.py', '        if path == "/api/config":\n            self.send_json({"enabled": True, "baseUrl": self.base_url, "expiresMinutes": {"photo": 20, "share": 30, "card": 30}, "limits": {"activeSessions": MAX_ACTIVE_SESSIONS, "memoryMB": MAX_SESSION_MEMORY_BYTES // (1024 * 1024)}})\n            return', '        if path == "/healthz":\n            self.send_json({"ok": True})\n            return\n\n        if path == "/api/config":\n            self.send_json({"enabled": True, "baseUrl": self.base_url, "mode": self.transfer_mode, "expiresMinutes": {"photo": 20, "share": 30, "card": 30}, "limits": {"activeSessions": MAX_ACTIVE_SESSIONS, "memoryMB": MAX_SESSION_MEMORY_BYTES // (1024 * 1024), "createsPerMinute": MAX_SESSION_CREATES_PER_MINUTE}})\n            return')

          # Rate-limit each new temporary session before reserving capacity.
          for anchor in [
              '            with sessions_lock:\n                if not reserve_session_capacity_locked(extra_session=True):',
              '            with sessions_lock:\n                if not reserve_session_capacity_locked(len(markup.encode("utf-8")), extra_session=True):',
              '            with sessions_lock:\n                if not reserve_session_capacity_locked(len(raw), extra_session=True):',
          ]:
              replacement = anchor.replace('            with sessions_lock:\n', '            with sessions_lock:\n                if not allow_session_create_locked():\n                    self.send_json({"error": "rate-limited"}, HTTPStatus.TOO_MANY_REQUESTS)\n                    return\n')
              replace_once('server/app.py', anchor, replacement)

          replace_once('server/app.py', '''def main() -> None:\n    parser = argparse.ArgumentParser(description="じぶんページ工房をLAN内で起動します")\n    parser.add_argument("--port", type=int, default=int(os.environ.get("PORT", "4173")))\n    parser.add_argument("--host", default="0.0.0.0")\n    args = parser.parse_args()\n\n    server = ThreadingHTTPServer((args.host, args.port), KoboHandler)\n    server.lan_ip = get_lan_ip()  # type: ignore[attr-defined]\n    local_url = f"http://localhost:{server.server_port}"\n    lan_url = f"http://{server.lan_ip}:{server.server_port}"  # type: ignore[attr-defined]\n    print("\\nじぶんページ工房を起動しました。")\n    print(f"このパソコン: {local_url}")\n    print(f"同じLANから: {lan_url}")\n    print("止めるときは Ctrl+C を押してください。\\n")\n''', '''def main() -> None:\n    parser = argparse.ArgumentParser(description="じぶんページ工房のWebサーバーを起動します")\n    parser.add_argument("--port", type=int, default=int(os.environ.get("PORT", "4173")))\n    parser.add_argument("--host", default="0.0.0.0")\n    parser.add_argument("--public-base-url", default=os.environ.get("PUBLIC_BASE_URL", ""), help="公開時にQRへ埋め込むURL（例: https://craft.example.com）")\n    args = parser.parse_args()\n    try:\n        public_base_url = normalize_public_base_url(args.public_base_url)\n    except ValueError as exc:\n        parser.error(str(exc))\n\n    server = ThreadingHTTPServer((args.host, args.port), KoboHandler)\n    server.lan_ip = get_lan_ip()  # type: ignore[attr-defined]\n    server.public_base_url = public_base_url  # type: ignore[attr-defined]\n    local_url = f"http://localhost:{server.server_port}"\n    lan_url = f"http://{server.lan_ip}:{server.server_port}"  # type: ignore[attr-defined]\n    print("\\nじぶんページ工房を起動しました。")\n    print(f"このパソコン: {local_url}")\n    if public_base_url:\n        print(f"公開URL / QR: {public_base_url}")\n        if not public_base_url.startswith("https://"):\n            print("注意: インターネット公開ではHTTPSを使用してください。", file=sys.stderr)\n    else:\n        print(f"同じLANから: {lan_url}")\n        print("公開時は PUBLIC_BASE_URL=https://... を設定できます。")\n    print("止めるときは Ctrl+C を押してください。\\n")\n''')

          # Child UI: the API can be LAN or public; do not reject public hosting as “not LAN”.
          child=Path('web/js/child.js')
          text=child.read_text(encoding='utf-8')
          text=text.replace('lanInfo', 'transferInfo').replace('checkLan', 'checkTransferServer').replace('ensureLan', 'ensureTransferServer')
          text=text.replace('LANサーバーに接続できません。インストール時に表示された「このPC」または「同じLAN」のURLから開いているか確認してね。', 'QR機能に接続できません。しばらくしてからもういちどためしてね。')
          text=text.replace('QRはLANサーバーから開いたときにつかえるよ。インストール時に表示された「このPC」または「同じLAN」のURLから開いてね。このパソコンへの保存はできます。', 'QR機能用サーバーに接続できません。このパソコンへの保存はできます。')
          text=text.replace('LANモードで QRがつかえます', 'QR機能用サーバーが必要です')
          text=text.replace('おなじWi-Fiのスマホで よみこんで、プレビューとおなじ写真を ほぞんしてね。', 'スマホで よみこんで、プレビューとおなじ写真を ほぞんしてね。')
          text=text.replace('QRはLANサーバーから開くと つかえるよ。インストール時に表示されたURLから開いてね', 'QR機能に接続できません。しばらくしてからもういちどためしてね')
          child.write_text(text,encoding='utf-8')

          # Adult UI: same-origin API works on both LAN and public deployments.
          adult=Path('web/js/adult.js')
          text=adult.read_text(encoding='utf-8')
          text=text.replace('lanInfo', 'transferInfo').replace('checkLan', 'checkTransferServer').replace('ensureLan', 'ensureTransferServer')
          text=text.replace('同じWi-Fiのスマホで読み込み、写真を選んで「パソコンへ送る」を押してください。', 'スマホで読み込み、写真を選んで「パソコンへ送る」を押してください。')
          text=text.replace('LANサーバーに接続できません。インストール時に表示された「このPC」または「同じLAN」のURLから開いているか確認してください。', 'QR機能用サーバーに接続できません。公開サーバーの設定を確認してください。')
          text=text.replace('同じWi-Fiのスマホで読み込むと、完成ページを開いてHTMLを保存できます。', 'スマホで読み込むと、完成ページを開いてHTMLを保存できます。')
          text=text.replace('LANサーバーを確認してください。', 'QR機能用サーバーを確認してください。')
          text=text.replace('QR機能はLANサーバーから開くと使えます。インストール時に表示されたURLから開いてください', 'QR機能用サーバーに接続できません。公開サーバーの設定を確認してください')
          adult.write_text(text,encoding='utf-8')

          # Landing page wording supports public and local modes.
          index=Path('web/index.html')
          text=index.read_text(encoding='utf-8')
          text=text.replace('HTML・CSS・JavaScriptの3ステップで、Webサイトを形にする仕事を体験するローカルWeb工作室。', 'HTML・CSS・JavaScriptの3ステップで、Webサイトを形にする仕事を体験するWeb工作室。')
          text=text.replace('LAN内で使える、小さなWeb制作体験ツール。', 'ブラウザで使える、小さなWeb制作体験ツール。')
          text=text.replace("if(data.enabled){chip.classList.add('ready');chip.innerHTML='<span></span> LANモード：QR機能が使えます';}", "if(data.enabled){chip.classList.add('ready');chip.innerHTML=data.mode==='public'?'<span></span> 公開モード：QR機能が使えます':'<span></span> QRサーバー接続済み：QR機能が使えます';}")
          text=text.replace("chip.innerHTML='<span></span> 静的モード：QRはLAN版で使えます';", "chip.innerHTML='<span></span> 静的版：QR機能にはサーバーが必要です';")
          index.write_text(text,encoding='utf-8')

          # systemd: PUBLIC_BASE_URL is optional, but when set it becomes the QR origin.
          install=Path('scripts/systemd/install.sh')
          text=install.read_text(encoding='utf-8')
          text=text.replace('CHECK_ONLY="${CHECK_ONLY:-0}"', 'CHECK_ONLY="${CHECK_ONLY:-0}"\nPUBLIC_BASE_URL="${PUBLIC_BASE_URL:-}"')
          text=text.replace('if [[ ! -f "$ROOT/server/app.py" ]]; then', 'if [[ -n "$PUBLIC_BASE_URL" ]] && [[ ! "$PUBLIC_BASE_URL" =~ ^https?://[^[:space:]]+$ ]]; then\n  echo "PUBLIC_BASE_URL は https://example.com の形式で指定してください。" >&2\n  exit 1\nfi\n\nif [[ ! -f "$ROOT/server/app.py" ]]; then')
          text=text.replace('Description=Web First Craft LAN workshop server', 'Description=Web First Craft workshop server')
          text=text.replace('Environment=PYTHONDONTWRITEBYTECODE=1', 'Environment=PYTHONDONTWRITEBYTECODE=1\nEnvironment=PUBLIC_BASE_URL=$PUBLIC_BASE_URL')
          text=text.replace('LAN_URL="$(\n', 'TRANSFER_URL="$(\n')
          text=text.replace('if [[ -n "$LAN_URL" ]]; then\n  echo "同じLAN: $LAN_URL"\nelse\n  echo "同じLANのURLを取得できませんでした。http://localhost:$PORT/api/config の baseUrl を確認してください。" >&2\nfi', 'if [[ -n "$TRANSFER_URL" ]]; then\n  if [[ -n "$PUBLIC_BASE_URL" ]]; then\n    echo "公開URL / QR: $TRANSFER_URL"\n  else\n    echo "QR接続URL: $TRANSFER_URL"\n  fi\nelse\n  echo "QR用URLを取得できませんでした。http://localhost:$PORT/api/config の baseUrl を確認してください。" >&2\nfi')
          install.write_text(text,encoding='utf-8')

          # Public deployment assets.
          Path('Dockerfile').write_text('''FROM python:3.12-slim\n\nENV PYTHONDONTWRITEBYTECODE=1 \\\n    PYTHONUNBUFFERED=1 \\\n    PORT=8080\n\nWORKDIR /app\nCOPY . .\nRUN useradd --system --create-home appuser\nUSER appuser\nEXPOSE 8080\n\nCMD ["sh", "-c", "exec python3 server/app.py --host 0.0.0.0 --port ${PORT:-8080}"]\n''',encoding='utf-8')
          Path('.dockerignore').write_text('''.git\n.github\narchive\ndocs\ntests\n**/__pycache__\n**/*.pyc\n''',encoding='utf-8')
          Path('docs/public-deployment.md').write_text('''# 公開サイトとして動かす\n\nQRの写真転送・作品カード・完成HTML共有は `/api/...` を使うため、**GitHub Pagesのような静的ホスティングだけでは動きません**。`web/` と `server/app.py` を同じWebサービスとして公開してください。\n\n## 必須設定\n\n公開URLが `https://craft.example.com` の場合は、Webサービスの環境変数へ次を設定します。\n\n```text\nPUBLIC_BASE_URL=https://craft.example.com\n```\n\nこれにより、QRコードにはローカルIPではなく公開HTTPS URLが入ります。`PUBLIC_BASE_URL` を省略しても、一般的なHTTPSリバースプロキシが `Host` と `X-Forwarded-Proto` を転送していればリクエストURLから自動判定しますが、本番では明示設定を推奨します。\n\n## Docker\n\n```bash\ndocker build -t web-first-craft .\ndocker run --rm -p 8080:8080 \\\n  -e PORT=8080 \\\n  -e PUBLIC_BASE_URL=https://craft.example.com \\\n  web-first-craft\n```\n\nホスティングサービスではコンテナの `PORT` をサービス指定値へ合わせ、HTTPSはサービス側またはリバースプロキシで終端してください。ヘルスチェックは `/healthz` を利用できます。\n\n## Ubuntu + systemd\n\n既存のUbuntuサーバーを公開する場合は、HTTPSを提供するリバースプロキシの後ろでこのアプリを動かし、次のように再登録します。\n\n```bash\nPUBLIC_BASE_URL=https://craft.example.com bash scripts/systemd/install.sh\n```\n\nアプリ本体の4173番ポートを直接インターネットへ公開するのではなく、HTTPSのWebサーバー/リバースプロキシ経由で公開してください。\n\n## 注意\n\n- 写真・完成HTML・カードはディスクへ保存せず、1プロセスのメモリにだけ一時保持します。\n- QRセッションを使う間は **1インスタンス構成** にしてください。複数インスタンスへ水平分散すると、作成したQRとアップロード先が別プロセスになり得ます。\n- 再起動・再デプロイで一時QRセッションは消えます。\n- 公開利用では必ずHTTPSを使用してください。\n- このアプリにはログイン機能がありません。QR URLは有効期限付きの受け取り鍵として扱ってください。\n''',encoding='utf-8')

          # README follows public/server-backed deployment semantics.
          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          text=text.replace('「技術で自分のページを作る」体験を、**こどもモード**と**カスタムモード**の2本で提供するLAN向けWeb制作ワークショップです。', '「技術で自分のページを作る」体験を、**こどもモード**と**カスタムモード**の2本で提供するWeb制作ワークショップです。ローカル/LAN利用と、Pythonサーバーごとの公開HTTPS運用に対応します。')
          text=text.replace('- PCから写真を選択、または同一LANのスマホからQRで写真送信', '- PCから写真を選択、またはスマホからQRで写真送信')
          text=text.replace('スマートフォンはパソコンと同じWi-Fiへ接続してください。QR機能を使うときは、GitHub PagesやHTMLファイル直開きではなく、起動時に表示された `このパソコン` / `同じLAN` のURLから開いてください。', 'LAN運用ではスマートフォンをパソコンと同じWi-Fiへ接続してください。公開HTTPS運用では同じWi-Fiである必要はありません。QR機能はPythonの `/api/...` を使うため、GitHub PagesやHTMLファイル直開きだけでは利用できません。')
          marker='''> systemdサービスは現在のリポジトリ位置を参照します。登録後にフォルダを移動・削除した場合は、もう一度インストールスクリプトを実行してください。\n'''
          public_section='''> systemdサービスは現在のリポジトリ位置を参照します。登録後にフォルダを移動・削除した場合は、もう一度インストールスクリプトを実行してください。\n\n### 公開サイトとして動かす\n\n公開URLをQRへ入れるには、静的ファイルだけではなく `server/app.py` も同じWebサービスとして公開します。\n\n```bash\nPUBLIC_BASE_URL=https://craft.example.com python3 server/app.py --host 0.0.0.0 --port 8080\n```\n\nUbuntuのsystemdでは次のように登録できます。\n\n```bash\nPUBLIC_BASE_URL=https://craft.example.com bash scripts/systemd/install.sh\n```\n\nDockerにも対応しています。公開時はHTTPSを使用し、詳しい構成は [`docs/public-deployment.md`](./docs/public-deployment.md) を参照してください。GitHub Pagesは静的プレビュー用途で、QR転送バックエンドは動きません。\n'''
          if marker not in text: raise SystemExit('README systemd marker missing')
          text=text.replace(marker,public_section,1)
          text=text.replace('LANサーバーは `ThreadingHTTPServer` で複数リクエストを並行処理します。', 'Webサーバーは `ThreadingHTTPServer` で複数リクエストを並行処理します。')
          text=text.replace('LANサーバーは一時セッション数と総メモリ使用量にも上限を設け、古いセッションから整理してメモリの増え続けを防ぎます。', 'サーバーは一時セッション数と総メモリ使用量に上限を設けます。期限切れセッションだけを整理し、上限に達した場合は新規QR作成を拒否するため、利用中の参加者セッションを新規アクセスで追い出しません。新規セッション作成には1分あたりの上限もあります。')
          text=text.replace('写真はLANサーバーのメモリに一時保持し、約20分で失効します。', '写真はWebサーバーのメモリに一時保持し、約20分で失効します。')
          text=text.replace('## LAN運用上の注意', '## 運用上の注意')
          text=text.replace('- QR転送は家庭・教室など管理された同一LAN向けです。\n- インターネットへのポート開放はしないでください。', '- LAN運用では家庭・教室など管理されたネットワークを利用してください。\n- 公開運用ではHTTPSを使用し、`PUBLIC_BASE_URL` に公開URLを設定してください。アプリのHTTPポートをそのままインターネットへ露出させず、HTTPSのリバースプロキシまたはHTTPS対応ホスティングサービスを使用してください。')
          text=text.replace('GitHub Pagesのデプロイは自動実行せず、Pagesを有効化した場合だけActionsから手動実行します。Pages版ではLANバックエンドがないためQR機能は利用できません。', 'GitHub Pagesのデプロイは自動実行せず、Pagesを有効化した場合だけActionsから手動実行します。Pages版は静的プレビューのためQR機能は利用できません。QRを含む公開版はPythonサーバーまたはDockerごとデプロイしてください。')
          readme.write_text(text,encoding='utf-8')

          # Security model now explicitly covers public HTTPS deployments.
          security=Path('SECURITY.md')
          text=security.read_text(encoding='utf-8')
          text=text.replace('## 想定している利用環境\n\n- 家庭、教室、ワークショップなど、参加者を把握できるプライベートLAN\n- パソコンとスマートフォンが同じWi‑Fiに接続された状態\n- インターネットから到達できない構成', '## 想定している利用環境\n\n- 家庭、教室、ワークショップなど、参加者を把握できるプライベートLAN\n- または、HTTPS・単一アプリインスタンス・`PUBLIC_BASE_URL` を設定した公開Webサーバー\n- 公開運用ではQR URLを有効期限付きの受け取り鍵として管理できる運営体制')
          text=text.replace('## 想定していない利用環境\n\n- 公衆Wi‑Fiや、不特定多数が参加するネットワーク\n- ルーターでのポート開放\n- リバースプロキシ等を使ったインターネット公開\n- HTTPSが必須となる機密情報の交換\n- 長期間のファイル保管やユーザー認証', '## 想定していない利用環境\n\n- HTTPのままインターネットへ直接公開する構成\n- アプリのポートをそのままインターネットへ露出する構成\n- 複数インスタンスへ水平分散した構成（セッションは各プロセスのメモリにあります）\n- 長期間のファイル保管や厳格なユーザー認証が必要な用途\n- 高機密情報の交換')
          text=text.replace('このサーバーにはログイン機能がありません。QRコードまたは共有URLを見られる人は、有効時間内であれば対象データへアクセスできます。QRコードを受け取り鍵として扱ってください。', 'このサーバーにはログイン機能がありません。QRコードまたは共有URLを見られる人は、有効時間内であれば対象データへアクセスできます。QRコードを受け取り鍵として扱ってください。公開運用ではHTTPSを必須とし、セッション数・総メモリ・新規セッション作成頻度の上限を設けていますが、認証付きストレージの代替ではありません。')
          security.write_text(text,encoding='utf-8')

          # Tests: public origin generation, health endpoint, no legacy LAN-only guidance, bounded live sessions.
          static=Path('tests/check_static.py')
          text=static.read_text(encoding='utf-8')
          text=text.replace('        if "server.py" in text:\n            fail(f"{js_path.name}: legacy server.py QR guidance remains")', '        if "server.py" in text:\n            fail(f"{js_path.name}: legacy server.py QR guidance remains")\n        for legacy_qr in ("LANサーバーから開く", "インストール時に表示されたURL"):\n            if legacy_qr in text:\n                fail(f"{js_path.name}: legacy LAN-only QR guidance remains: {legacy_qr}")')
          text=text.replace('required=["server/app.py",', 'required=["Dockerfile","docs/public-deployment.md","server/app.py",')
          static.write_text(text,encoding='utf-8')

          test=Path('tests/test_server.py')
          text=test.read_text(encoding='utf-8')
          text=text.replace('"""Integration checks for LAN QR/photo/HTML/card transfer using stdlib only."""', '"""Integration checks for local/public QR, photo, HTML and card transfer."""')
          text=text.replace('from urllib.request import Request, urlopen', 'from urllib.error import HTTPError\nfrom urllib.request import Request, urlopen')
          text=text.replace('kobo.photo_sessions.clear();kobo.share_sessions.clear();kobo.card_sessions.clear()\n    httpd=kobo.ThreadingHTTPServer(("127.0.0.1",0),kobo.KoboHandler);httpd.lan_ip="127.0.0.1"', 'kobo.photo_sessions.clear();kobo.share_sessions.clear();kobo.card_sessions.clear();kobo.session_create_times.clear()\n    httpd=kobo.ThreadingHTTPServer(("127.0.0.1",0),kobo.KoboHandler);httpd.lan_ip="127.0.0.1";httpd.public_base_url=""')
          text=text.replace('cfg=json.load(r);assert cfg["enabled"] is True and cfg["expiresMinutes"]["card"]==30 and cfg["limits"]["activeSessions"]==kobo.MAX_ACTIVE_SESSIONS', 'cfg=json.load(r);assert cfg["enabled"] is True and cfg["expiresMinutes"]["card"]==30 and cfg["limits"]["activeSessions"]==kobo.MAX_ACTIVE_SESSIONS and cfg["mode"]=="local"\n        with request(base,"/healthz") as r: assert json.load(r)["ok"] is True\n        public_req=Request(base+"/api/config",headers={"Host":"craft.example.test","X-Forwarded-Proto":"https"})\n        with urlopen(public_req,timeout=5) as r:\n            public_cfg=json.load(r);assert public_cfg["baseUrl"]=="https://craft.example.test" and public_cfg["mode"]=="public"\n        httpd.public_base_url="https://public.example.test"\n        with request(base,"/api/photo-sessions",{}) as r:\n            public_session=json.load(r);assert public_session["uploadUrl"].startswith("https://public.example.test/phone/photo/")\n        httpd.public_base_url=""')
          old='''        # A busy workshop cannot grow unbounded session metadata in memory.\n        original_limit=kobo.MAX_ACTIVE_SESSIONS\n        try:\n            kobo.MAX_ACTIVE_SESSIONS=12\n            for _ in range(20):\n                with request(base,"/api/photo-sessions",{}) as r: assert json.load(r)["token"]\n            with kobo.sessions_lock:\n                total=len(kobo.photo_sessions)+len(kobo.share_sessions)+len(kobo.card_sessions)\n            assert total<=12\n        finally:\n            kobo.MAX_ACTIVE_SESSIONS=original_limit\n        print("OK: static pages, QR, gallery/camera photo, concurrent isolated sessions, sandboxed HTML share, bounded sessions, PNG card share")\n'''
          new='''        # Public traffic cannot evict active participant sessions when capacity is full.\n        original_limit=kobo.MAX_ACTIVE_SESSIONS\n        original_rate=kobo.MAX_SESSION_CREATES_PER_MINUTE\n        try:\n            with kobo.sessions_lock:\n                kobo.photo_sessions.clear();kobo.share_sessions.clear();kobo.card_sessions.clear();kobo.session_create_times.clear()\n            kobo.MAX_ACTIVE_SESSIONS=4\n            kobo.MAX_SESSION_CREATES_PER_MINUTE=20\n            created=[]\n            for _ in range(4):\n                with request(base,"/api/photo-sessions",{}) as r: created.append(json.load(r)["token"])\n            try:\n                request(base,"/api/photo-sessions",{})\n                raise AssertionError("capacity limit did not reject a new session")\n            except HTTPError as exc:\n                assert exc.code==503\n            with kobo.sessions_lock:\n                assert set(created).issubset(kobo.photo_sessions)\n                kobo.photo_sessions.clear();kobo.session_create_times.clear()\n            kobo.MAX_ACTIVE_SESSIONS=20\n            kobo.MAX_SESSION_CREATES_PER_MINUTE=2\n            for _ in range(2):\n                with request(base,"/api/photo-sessions",{}) as r: assert json.load(r)["token"]\n            try:\n                request(base,"/api/photo-sessions",{})\n                raise AssertionError("rate limit did not reject session creation")\n            except HTTPError as exc:\n                assert exc.code==429\n        finally:\n            kobo.MAX_ACTIVE_SESSIONS=original_limit\n            kobo.MAX_SESSION_CREATES_PER_MINUTE=original_rate\n        print("OK: local/public URL generation, static pages, QR, gallery/camera photo, concurrent isolated sessions, sandboxed HTML share, bounded/rate-limited sessions, PNG card share")\n'''
          if old not in text: raise SystemExit('server test capacity block missing')
          text=text.replace(old,new,1)
          test.write_text(text,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check web/js/child.js
          node --check web/js/adult.js
          python3 -m py_compile server/app.py tests/check_static.py tests/test_server.py
          python3 tests/check_static.py
          python3 tests/test_server.py
          bash -n scripts/launch/start-local.command scripts/systemd/install.sh scripts/systemd/uninstall.sh
          CHECK_ONLY=1 bash scripts/systemd/install.sh
          PUBLIC_BASE_URL=https://craft.example.test CHECK_ONLY=1 bash scripts/systemd/install.sh

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app.py web/js/child.js web/js/adult.js web/index.html scripts/systemd/install.sh tests/check_static.py tests/test_server.py README.md SECURITY.md Dockerfile .dockerignore docs/public-deployment.md
          git commit -m "Support public QR hosting"
          git push origin HEAD:main
