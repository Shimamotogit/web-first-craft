name: Reorganize repository

on:
  push:
    paths:
      - scripts/reorganize_repo.py
      - .github/workflows/reorganize.yml

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Reorganize files
        run: python3 scripts/reorganize_repo.py
      - name: Validate new structure
        run: |
          node --check web/js/child.js
          node --check web/js/adult.js
          python3 -m py_compile server/app.py tests/test_server.py tests/check_static.py
          bash -n scripts/launch/start-local.command scripts/systemd/install.sh scripts/systemd/uninstall.sh
          CHECK_ONLY=1 bash scripts/systemd/install.sh
          python3 tests/check_static.py
          python3 tests/test_server.py
      - name: Commit reorganization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reorganize project structure"
          git push origin HEAD:main
