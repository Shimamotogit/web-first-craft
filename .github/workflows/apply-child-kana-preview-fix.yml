name: Apply child kana and preview fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-child-kana-preview-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_child_kana_preview.py
      - name: Validate JavaScript
        run: node --check child.js
      - name: Run static checks
        run: python3 scripts/check_static.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add child.js child.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix child kana pad and preview"
          git push
