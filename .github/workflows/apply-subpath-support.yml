name: Apply public subpath support

on:
  push:
    paths:
      - '.github/workflows/apply-subpath-support.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add subpath support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"anchor not found: {label}")
              return text.replace(old, new, 1)

          # server/app.py
          p=Path('server/app.py'); text=p.read_text(encoding='utf-8')
          old='''def normalize_public_base_url(value: str) -> str:\n    value = str(value or "").strip()\n    if not value:\n        return ""\n    parsed = urlparse(value)\n    if parsed.scheme not in {"http", "https"} or not parsed.netloc or parsed.path not in {"", "/"} or parsed.params or parsed.query or parsed.fragment:\n        raise ValueError("PUBLIC_BASE_URL must be an origin such as https://example.com")\n    if any(ch in parsed.netloc for ch in "\\r\\n"):\n        raise ValueError("invalid PUBLIC_BASE_URL")\n    return f"{parsed.scheme}://{parsed.netloc}"\n'''
          new='''def normalize_public_base_url(value: str) -> str:\n    value = str(value or "").strip()\n    if not value:\n        return ""\n    parsed = urlparse(value)\n    if parsed.scheme not in {"http", "https"} or not parsed.netloc or parsed.params or parsed.query or parsed.fragment:\n        raise ValueError("PUBLIC_BASE_URL must be a URL such as https://example.com or https://example.com/my-site")\n    if parsed.username or parsed.password or any(ch in parsed.netloc for ch in "\\r\\n"):\n        raise ValueError("invalid PUBLIC_BASE_URL")\n    path = parsed.path.rstrip("/")\n    if path and not re.fullmatch(r"(?:/[A-Za-z0-9._~-]+)+", path):\n        raise ValueError("PUBLIC_BASE_URL path must contain only safe path segments such as /my-site")\n    return f"{parsed.scheme}://{parsed.netloc}{path}"\n'''
          text=replace_once(text,old,new,'normalize_public_base_url')

          old='''    @property\n    def transfer_mode(self) -> str:\n        return "public" if self.base_url.startswith("https://") else "local"\n\n    def send_bytes'''
          new='''    @property\n    def transfer_mode(self) -> str:\n        return "public" if self.base_url.startswith("https://") else "local"\n\n    @property\n    def public_path_prefix(self) -> str:\n        configured = str(getattr(self.server, "public_base_url", "") or "")\n        return urlparse(configured).path.rstrip("/") if configured else ""\n\n    def routed_path(self) -> str:\n        path = unquote(urlparse(self.path).path)\n        prefix = self.public_path_prefix\n        if prefix:\n            if path == prefix:\n                return "/"\n            if path.startswith(prefix + "/"):\n                return path[len(prefix):]\n        # Keep unprefixed routes working for localhost health checks and upgrades.\n        return path\n\n    def app_path(self, path: str) -> str:\n        return f"{self.public_path_prefix}{path}"\n\n    def send_bytes'''
          text=replace_once(text,old,new,'handler path helpers')
          text=replace_once(text,'        path = unquote(parsed.path)\n\n        if path == "/healthz":','        path = self.routed_path()\n\n        if path == "/healthz":','GET routed path')
          text=replace_once(text,'        path = unquote(urlparse(self.path).path)\n\n        if path == "/api/photo-sessions":','        path = self.routed_path()\n\n        if path == "/api/photo-sessions":','POST routed path')

          text=replace_once(text,'def phone_upload_page(token: str, expires_at: float) -> str:\n    remaining = max(1, int((expires_at - now()) / 60))\n    token_json = json.dumps(token)','def phone_upload_page(token: str, expires_at: float, base_path: str = "") -> str:\n    remaining = max(1, int((expires_at - now()) / 60))\n    token_json = json.dumps(token)\n    base_path_json = json.dumps(base_path)','phone signature')
          text=replace_once(text,"const token={token_json};const back=document.getElementById('back');","const token={token_json};const basePath={base_path_json};const back=document.getElementById('back');",'phone basePath JS')
          text=replace_once(text,"fetch('/api/photo-sessions/'+encodeURIComponent(token)+'/photo'","fetch(basePath+'/api/photo-sessions/'+encodeURIComponent(token)+'/photo'",'phone POST path')
          text=replace_once(text,'phone_upload_page(token, item["expires_at"])','phone_upload_page(token, item["expires_at"], self.public_path_prefix)','phone call')

          text=replace_once(text,'def share_landing_page(token: str, item: dict) -> str:\n    filename = html.escape(item["filename"])','def share_landing_page(token: str, item: dict, base_path: str = "") -> str:\n    filename = html.escape(item["filename"])\n    path_prefix = html.escape(base_path, quote=True)','share signature')
          text=replace_once(text,'href="/api/shares/{quote(token)}/download"','href="{path_prefix}/api/shares/{quote(token)}/download"','share download href')
          text=replace_once(text,'href="/api/shares/{quote(token)}/view"','href="{path_prefix}/api/shares/{quote(token)}/view"','share view href')
          text=replace_once(text,'share_landing_page(token, item)','share_landing_page(token, item, self.public_path_prefix)','share call')

          text=replace_once(text,'def card_landing_page(token: str, item: dict) -> str:\n    title = html.escape(item.get("title") or "作品カード")\n    filename = html.escape(item["filename"])','def card_landing_page(token: str, item: dict, base_path: str = "") -> str:\n    title = html.escape(item.get("title") or "作品カード")\n    filename = html.escape(item["filename"])\n    path_prefix = html.escape(base_path, quote=True)','card signature')
          text=replace_once(text,'src="/api/cards/{quote(token)}/view"','src="{path_prefix}/api/cards/{quote(token)}/view"','card view src')
          text=replace_once(text,'href="/api/cards/{quote(token)}/download"','href="{path_prefix}/api/cards/{quote(token)}/download"','card download href')
          text=replace_once(text,'card_landing_page(token, item)','card_landing_page(token, item, self.public_path_prefix)','card call')
          text=text.replace('help="公開時にQRへ埋め込むURL（例: https://craft.example.com）"','help="公開時にQRへ埋め込むURL（例: https://craft.example.com/my-site）"')
          p.write_text(text,encoding='utf-8')

          # web/js/child.js
          p=Path('web/js/child.js'); text=p.read_text(encoding='utf-8')
          text=replace_once(text,'  const STORAGE_KEY = "jibun-page-kobo-child-v3";','  const STORAGE_KEY = "jibun-page-kobo-child-v3";\n  const APP_BASE = new URL(".", window.location.href);\n  const appUrl = path => new URL(String(path).replace(/^\\/+/, ""), APP_BASE).toString();','child appUrl')
          text=text.replace('fetch("/api/photo-sessions",','fetch(appUrl("api/photo-sessions"),')
          text=text.replace('fetch(`/api/photo-sessions/${encodeURIComponent(activePhotoToken)}`,','fetch(appUrl(`api/photo-sessions/${encodeURIComponent(activePhotoToken)}`),')
          text=text.replace('fetch("/api/cards",','fetch(appUrl("api/cards"),')
          text=text.replace('img.src=`/api/qr?text=${encodeURIComponent(data.uploadUrl)}&t=${Date.now()}`','img.src=appUrl(`api/qr?text=${encodeURIComponent(data.uploadUrl)}&t=${Date.now()}`)')
          text=text.replace('img.src=`/api/qr?text=${encodeURIComponent(data.cardUrl)}&t=${Date.now()}`','img.src=appUrl(`api/qr?text=${encodeURIComponent(data.cardUrl)}&t=${Date.now()}`)')
          text=text.replace('fetch("/api/config",','fetch(appUrl("api/config"),')
          p.write_text(text,encoding='utf-8')

          # web/js/adult.js
          p=Path('web/js/adult.js'); text=p.read_text(encoding='utf-8')
          text=replace_once(text,'  const STORAGE_KEY="jibun-page-kobo-adult-v3";','  const STORAGE_KEY="jibun-page-kobo-adult-v3";\n  const APP_BASE=new URL(".",window.location.href);\n  const appUrl=path=>new URL(String(path).replace(/^\\/+/,""),APP_BASE).toString();','adult appUrl')
          text=text.replace("fetch('/api/photo-sessions',","fetch(appUrl('api/photo-sessions'),")
          text=text.replace('fetch(`/api/photo-sessions/${encodeURIComponent(photoToken)}`,','fetch(appUrl(`api/photo-sessions/${encodeURIComponent(photoToken)}`),')
          text=text.replace("fetch('/api/shares',","fetch(appUrl('api/shares'),")
          text=text.replace("img.src=`/api/qr?text=${encodeURIComponent(url)}&t=${Date.now()}`","img.src=appUrl(`api/qr?text=${encodeURIComponent(url)}&t=${Date.now()}`)")
          text=text.replace("fetch('/api/config',","fetch(appUrl('api/config'),")
          p.write_text(text,encoding='utf-8')

          # index page uses a relative API URL so /my-site/ stays under /my-site/.
          p=Path('web/index.html'); text=p.read_text(encoding='utf-8')
          text=replace_once(text,"    fetch('/api/config').then", "    fetch(new URL('api/config',window.location.href)).then",'index api config')
          p.write_text(text,encoding='utf-8')

          # Documentation: single server under a reverse-proxy subpath.
          p=Path('docs/public-deployment.md'); text=p.read_text(encoding='utf-8')
          addition='''\n## `/my-site` のようなサブパスで公開する\n\n`https://zovira.jp/my-site/` のようにサブパスで公開する場合も、別のQRサーバーは不要です。`server/app.py` がサイトとQR APIの両方を担当します。\n\n```bash\nPUBLIC_BASE_URL=https://zovira.jp/my-site bash scripts/systemd/install.sh\n```\n\nNginxでは末尾スラッシュなしの `/my-site` を `/my-site/` へリダイレクトし、`/my-site/` 以下をプレフィックスを保持したまま4173番へ転送します。\n\n```nginx\nlocation = /my-site {\n    return 301 /my-site/;\n}\n\nlocation ^~ /my-site/ {\n    proxy_pass http://127.0.0.1:4173;\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-Proto $scheme;\n    proxy_set_header X-Real-IP $remote_addr;\n}\n```\n\n`proxy_pass http://127.0.0.1:4173;` の末尾に `/` を付けないでください。これにより `/my-site/api/config` などのパスがそのままアプリへ渡ります。設定後は `https://zovira.jp/my-site/api/config` で確認できます。\n'''
          if '## `/my-site` のようなサブパスで公開する' not in text:
              text += addition
          p.write_text(text,encoding='utf-8')

          p=Path('README.md'); text=p.read_text(encoding='utf-8')
          needle='PUBLIC_BASE_URL=https://craft.example.com bash scripts/systemd/install.sh\n```'
          repl='PUBLIC_BASE_URL=https://craft.example.com bash scripts/systemd/install.sh\n```\n\n`https://zovira.jp/my-site/` のようなサブパス公開にも対応しています。その場合は `PUBLIC_BASE_URL=https://zovira.jp/my-site` を指定し、Nginxで `/my-site/` をプレフィックスを保持したまま4173番へ転送します。'
          text=replace_once(text,needle,repl,'README public systemd')
          p.write_text(text,encoding='utf-8')

          # Integration tests for subpath mode.
          p=Path('tests/test_server.py'); text=p.read_text(encoding='utf-8')
          anchor='''        httpd.public_base_url=""\n        for page in ("/","/child.html","/adult.html"):\n'''
          insert='''        httpd.public_base_url="https://zovira.jp/my-site"\n        with request(base,"/my-site/api/config") as r:\n            sub_cfg=json.load(r);assert sub_cfg["enabled"] is True and sub_cfg["baseUrl"]=="https://zovira.jp/my-site" and sub_cfg["mode"]=="public"\n        with request(base,"/my-site/api/photo-sessions",{}) as r:\n            sub_session=json.load(r);assert sub_session["uploadUrl"].startswith("https://zovira.jp/my-site/phone/photo/")\n        sub_token=sub_session["token"]\n        with request(base,f"/my-site/phone/photo/{sub_token}") as r:\n            sub_phone=r.read().decode();assert 'const basePath="/my-site"' in sub_phone and "/my-site/api/photo-sessions/" not in sub_phone\n        with request(base,"/my-site/") as r: assert r.status==200 and b"<!doctype html>" in r.read().lower()\n        httpd.public_base_url=""\n        for page in ("/","/child.html","/adult.html"):\n'''
          text=replace_once(text,anchor,insert,'server subpath tests')
          # Test normalizer directly too.
          anchor='''def main():\n    kobo.photo_sessions.clear();kobo.share_sessions.clear();kobo.card_sessions.clear();kobo.session_create_times.clear()\n'''
          insert='''def main():\n    assert kobo.normalize_public_base_url("https://zovira.jp/my-site/")=="https://zovira.jp/my-site"\n    try:\n        kobo.normalize_public_base_url("https://zovira.jp/a/../b")\n        raise AssertionError("unsafe public path accepted")\n    except ValueError:\n        pass\n    kobo.photo_sessions.clear();kobo.share_sessions.clear();kobo.card_sessions.clear();kobo.session_create_times.clear()\n'''
          text=replace_once(text,anchor,insert,'normalizer test')
          p.write_text(text,encoding='utf-8')

          # Static checks ensure root-absolute API calls do not regress.
          p=Path('tests/check_static.py'); text=p.read_text(encoding='utf-8')
          anchor='''    child=(WEB/"js/child.js").read_text(encoding="utf-8")\n    adult=(WEB/"js/adult.js").read_text(encoding="utf-8")\n'''
          insert='''    child=(WEB/"js/child.js").read_text(encoding="utf-8")\n    adult=(WEB/"js/adult.js").read_text(encoding="utf-8")\n    for name, source in (("child.js", child), ("adult.js", adult)):\n        if re.search(r"(?:fetch\\(|img\\.src=)`?[\\\"']?/api/", source):\n            fail(f"{name}: root-absolute API path breaks subpath hosting")\n'''
          text=replace_once(text,anchor,insert,'static subpath guard')
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check web/js/child.js
          node --check web/js/adult.js
          python3 -m py_compile server/app.py tests/check_static.py tests/test_server.py
          python3 tests/check_static.py
          python3 tests/test_server.py
          bash -n scripts/launch/start-local.command scripts/systemd/install.sh scripts/systemd/uninstall.sh
          CHECK_ONLY=1 PUBLIC_BASE_URL=https://zovira.jp/my-site bash scripts/systemd/install.sh

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/app.py web/js/child.js web/js/adult.js web/index.html README.md docs/public-deployment.md tests/test_server.py tests/check_static.py
          git commit -m 'Support public subpath hosting'
          git push origin main
